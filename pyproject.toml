[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-redteamer"
version = "0.1.0"
description = "Autonomous MCP exploitation and AI red-teaming tool"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "docker>=7",
    "mcp>=2.1",
    "httpx>=0.27",
]

[project.scripts]
mcp-redteamer = "mcp_redteamer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mcp_redteamer"]
